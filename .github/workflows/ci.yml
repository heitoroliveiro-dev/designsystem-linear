name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tokens gerados estão em dia (e contraste WCAG passa)
        run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npx next build
